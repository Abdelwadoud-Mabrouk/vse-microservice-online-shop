version: '3.8'

services:

  # =========================
  # PostgreSQL - Audit Service
  # =========================
  audit-db:
    image: postgres:16-alpine
    container_name: audit-db
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
    ports:
      - "5432:5432"
    volumes:
      - audit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # PostgreSQL - Shop Service
  # =========================
  shop-db:
    image: postgres:16-alpine
    container_name: shop-db
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shop_password
    ports:
      - "5433:5432"
    volumes:
      - shop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_user -d shop_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # Zookeeper
  # =========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # =========================
  # Kafka Broker
  # =========================
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
     KAFKA_BROKER_ID: 1
     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
     KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
     KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # =========================
  # Audit Service
  # =========================
  audit-service:
    build:
      context: ./audit-service-dotnet
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AUDIT_DB_CONNECTION: Host=audit-db;Port=5432;Database=audit;Username=audit;Password=audit
    depends_on:
      audit-db:
        condition: service_healthy
    ports:
      - "5081:8080"

  # =========================
  # Warehouse Service
  # =========================
  warehouse-service:
    build:
      context: ./warehouse-service-dotnet
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AUDIT_SERVICE_URL: http://audit-service:8080
      WAREHOUSE_INITIAL_STOCK: SKU-CHAIR:10,SKU-DESK:5,SKU-LAMP:20
    depends_on:
      - audit-service
    ports:
      - "5082:8080"

  # =========================
  # Invoice Service
  # =========================
  invoice-service:
    build:
      context: ./invoice-service-dotnet
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AUDIT_SERVICE_URL: http://audit-service:8080
      INVOICE_RETRY_COUNT: 3
      INVOICE_FORCE_FAILURE: "false"
      INVOICE_DATA_DIR: /app/data/invoices
    depends_on:
      - audit-service
    ports:
      - "5083:8080"
    volumes:
      - invoice-data:/app/data/invoices

volumes:
  audit-db-data:
  shop-db-data:
  invoice-data: