services:
  # =========================
  # PostgreSQL - Audit Service
  # =========================
  audit-db:
    image: postgres:16-alpine
    container_name: audit-db
    environment:
      POSTGRES_DB: ${AUDIT_DB_NAME:?Set AUDIT_DB_NAME in .env}
      POSTGRES_USER: ${AUDIT_DB_USER:?Set AUDIT_DB_USER in .env}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:?Set AUDIT_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - audit-db-data:/var/lib/postgresql/data
    networks:
      - shop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUDIT_DB_USER:?Set AUDIT_DB_USER in .env} -d ${AUDIT_DB_NAME:?Set AUDIT_DB_NAME in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # PostgreSQL - Shop Service
  # =========================
  shop-db:
    image: postgres:16-alpine
    container_name: shop-db
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shop_password
    ports:
      - "5433:5432"
    volumes:
      - shop-db-data:/var/lib/postgresql/data
    networks:
      - shop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_user -d shop_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # PostgreSQL - Payment Service
  # =========================
  billing-db:
    image: postgres:16-alpine
    container_name: billing-db
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_password
    ports:
      - "5435:5432"
    volumes:
      - billing-db-data:/var/lib/postgresql/data
    networks: # <-- WICHTIG! War vorher nicht im Netz
      - shop-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U billing_user -d billing_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # PostgreSQL - Warehouse Service
  # =========================
  warehouse-db:
    image: postgres:16-alpine
    container_name: warehouse-db
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB_NAME:?Set WAREHOUSE_DB_NAME in .env}
      POSTGRES_USER: ${WAREHOUSE_DB_USER:?Set WAREHOUSE_DB_USER in .env}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?Set WAREHOUSE_DB_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - warehouse-db-data:/var/lib/postgresql/data
    networks:
      - shop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_DB_USER:?Set WAREHOUSE_DB_USER in .env} -d ${WAREHOUSE_DB_NAME:?Set WAREHOUSE_DB_NAME in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # Zookeeper
  # =========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - shop-network

  # =========================
  # Kafka Broker
  # =========================
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - shop-network

  # =========================
  # Kafka Topics
  # =========================
  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - kafka
    networks:
      - shop-network
    command:
      - bash
      - -c
      - |
        cub kafka-ready -b kafka:29092 1 60
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic orders --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic billing --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic warehouse --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic invoices --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic security-alerts --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic system-alerts --partitions 1 --replication-factor 1

  # =========================
  # Audit Service
  # =========================
  audit-service:
    build:
      context: .
      dockerfile: audit-service-dotnet/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AUDIT_DB_CONNECTION: Host=audit-db;Port=5432;Database=${AUDIT_DB_NAME:?Set AUDIT_DB_NAME in .env};Username=${AUDIT_DB_USER:?Set AUDIT_DB_USER in .env};Password=${AUDIT_DB_PASSWORD:?Set AUDIT_DB_PASSWORD in .env}
      WAREHOUSE_DB_CONNECTION: Host=warehouse-db;Port=5432;Database=${WAREHOUSE_DB_NAME:?Set WAREHOUSE_DB_NAME in .env};Username=${WAREHOUSE_DB_USER:?Set WAREHOUSE_DB_USER in .env};Password=${WAREHOUSE_DB_PASSWORD:?Set WAREHOUSE_DB_PASSWORD in .env}
      WAREHOUSE_SERVICE_URL: http://warehouse-service:8080
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      FRONTEND_ADMIN_URL: ${FRONTEND_ADMIN_URL:-http://localhost:3001/admin}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      KAFKA_AUDIT_TOPICS: ${KAFKA_AUDIT_TOPICS:-orders,billing,warehouse,invoices,security-alerts,system-alerts}
      KAFKA_AUDIT_CONSUMER_GROUP: ${KAFKA_AUDIT_CONSUMER_GROUP:-audit-service}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_DIRECTORY: /app/logs
      LOG_RETENTION_DAYS: 14
    networks:
      - shop-network
    depends_on:
      audit-db:
        condition: service_healthy
      warehouse-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    ports:
      - "5081:8080"
    volumes:
      - audit-logs:/app/logs

  # =========================
  # Warehouse Service
  # =========================
  warehouse-service:
    build:
      context: .
      dockerfile: warehouse-service-dotnet/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AUDIT_SERVICE_URL: http://audit-service:8080
      WAREHOUSE_DB_CONNECTION: Host=warehouse-db;Port=5432;Database=${WAREHOUSE_DB_NAME:?Set WAREHOUSE_DB_NAME in .env};Username=${WAREHOUSE_DB_USER:?Set WAREHOUSE_DB_USER in .env};Password=${WAREHOUSE_DB_PASSWORD:?Set WAREHOUSE_DB_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      LOG_DIRECTORY: /app/logs
      LOG_RETENTION_DAYS: 14
      KAFKA_WAREHOUSE_TOPIC: ${KAFKA_WAREHOUSE_TOPIC:-warehouse}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    networks:
      - shop-network
    depends_on:
      audit-service:
        condition: service_started
      warehouse-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    ports:
      - "5082:8080"
    volumes:
      - warehouse-logs:/app/logs

  # =========================
  # Invoice Service
  # =========================
  invoice-service:
    build:
      context: .
      dockerfile: invoice-service-dotnet/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AUDIT_SERVICE_URL: http://audit-service:8080
      INVOICE_RETRY_COUNT: 3
      INVOICE_FORCE_FAILURE: "false"
      INVOICE_DATA_DIR: /app/data/invoices
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      KAFKA_PAYMENT_SUCCEEDED_TOPIC: ${KAFKA_BILLING_TOPIC:-billing}
      KAFKA_INVOICES_TOPIC: ${KAFKA_INVOICES_TOPIC:-invoices}
      SUCCESS_PAGE_URL: http://localhost:3001/shop/checkout/success
      SHOP_SERVICE_URL: ${SHOP_SERVICE_URL:-http://shop-service:8087/}
      KAFKA_INVOICE_CONSUMER_GROUP: ${KAFKA_INVOICE_CONSUMER_GROUP:-invoice-service}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_DIRECTORY: /app/logs
      LOG_RETENTION_DAYS: 14
    networks:
      - shop-network
    depends_on:
      audit-service:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    ports:
      - "5083:8080"
    volumes:
      - invoice-data:/app/data/invoices
      - invoice-logs:/app/logs

  # =========================
  # SHOP SERVICE (Spring)
  # =========================
  shop-service:
    build:
      context: ./shop-service-java
    container_name: shop-service
    ports:
      - "8090:8087"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      LOG_PATH: /app/logs
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://shop-db:5432/shop_db
      SHOP_DB_URL: jdbc:postgresql://shop-db:5432/shop_db
      SHOP_DB_USERNAME: ${SHOP_DB_USERNAME:-shop_user}
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD:-shop_password}

      # Interne Container-URLs explizit überschreiben:
      SERVICES_WAREHOUSE_URL: http://warehouse-service:8080
      SERVICES_PAYMENT_URL: http://billing-service:8089/api/v1/billing
    networks:
      - shop-network
    depends_on:
      shop-db:
        condition: service_healthy
      billing-service: # Sicherstellen, dass das Billing-Service gestartet ist
        condition: service_started
      warehouse-service: # Sicherstellen, dass das Warehouse-Service gestartet ist
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./logs/shop-service:/app/logs

  # =========================
  # Shop Product Seed
  # =========================
  shop-product-seed:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${SHOP_DB_PASSWORD:-shop_password}
    networks:
      - shop-network
    depends_on:
      shop-service:
        condition: service_started
    command:
      - sh
      - -c
      - |
        until wget -qO /dev/null http://shop-service:8087/actuator/health; do
          sleep 2
        done
        psql -h shop-db -U ${SHOP_DB_USERNAME:-shop_user} -d shop_db -v ON_ERROR_STOP=1 -f /seed/seed-products.sql
    volumes:
      - ./infrastructure/shop-db/seed-products.sql:/seed/seed-products.sql:ro

  # =========================
  # BILLING SERVICE (Spring)
  # =========================
  billing-service:
    build:
      context: ./billing-service-java
    container_name: billing-service
    ports:
      - "8081:8089"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      LOG_PATH: /app/logs

      # Sichere DB-Verbindung (Nutzt Umgebungsvariable oder Standard-Docker-URL)
      SPRING_DATASOURCE_URL: ${BILLING_DB_URL:-jdbc:postgresql://billing-db:5432/billing_db}
      SPRING_DATASOURCE_USERNAME: ${BILLING_DB_USERNAME:-billing_user}
      SPRING_DATASOURCE_PASSWORD: ${BILLING_DB_PASSWORD:-billing_password}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID}

      SUCCESS_PAGE_URL: ${SUCCESS_PAGE_URL}
    networks:
      - shop-network
    depends_on:
      billing-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./logs/billing-service:/app/logs

  # =========================
  # NGROK TUNNEL
  # =========================
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok-tunnel
    restart: always
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "billing-service:8089"
    ports:
      - "4040:4040"
    networks:
      - shop-network
    depends_on:
      - billing-service

    # =========================
    # Stripe CLI
    # =========================
  stripe-cli:
      image: stripe/stripe-cli
      container_name: stripe-cli
      environment:
        STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
      command: listen --forward-to http://billing-service:8089/api/v1/billing/webhook/stripe
      networks:
        - shop-network
      depends_on:
        - billing-service
      restart: unless-stopped

  # =========================
  # Frontend (Angular)
  # =========================
  frontend-angular:
    build:
      context: ./frontend-angular
    container_name: frontend-angular
    ports:
      - "3001:80"
    networks:
      - shop-network
    depends_on:
      audit-service:
        condition: service_started
      shop-service:
        condition: service_started
      shop-product-seed:
        condition: service_completed_successfully
      warehouse-service:
        condition: service_started
      invoice-service:
        condition: service_started
    restart: unless-stopped

  # =========================
  # Observability
  # =========================
  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    networks:
      - shop-network
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel-collector-config.yml"]
    depends_on:
      - loki
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    networks:
      - shop-network
    volumes:
      - ./observability/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml:ro

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      - loki
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    networks:
      - shop-network
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  audit-db-data:
  shop-db-data:
  warehouse-db-data:
  invoice-data:
  loki-data:
  grafana-data:
  billing-db-data:
  audit-logs:
  warehouse-logs:
  invoice-logs:
  shop-logs:

networks:
  shop-network:
    driver: bridge