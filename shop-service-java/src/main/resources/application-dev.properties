

# =========================
# APIs
# =========================

services.warehouse.url=http://warehouse-service:8080
services.payment.url=http://billing-service:8089/api/v1/billing

# =========================
# PostgreSQL
# =========================

spring.datasource.url=${SHOP_DB_URL}
spring.datasource.username=${SHOP_DB_USERNAME}
spring.datasource.password=${SHOP_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always

# =========================
# JPA / Hibernate
# =========================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF

# =========================
# Kafka
# =========================

spring.kafka.bootstrap-servers=kafka:29092

# =========================
# Kafka Topics
# =========================

kafka.topics.orders=orders
kafka.topics.audit-events=audit-events
kafka.topics.alerts=alertTopic
kafka.topics.payment=billing

# =========================
# Actuator
# =========================

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always