server.port=8087

spring.application.name=shop-service

# =========================
# Apis
# =========================

services.warehouse.url =http://localhost:5082
services.payment.url=http://127.0.0.1:8089/api/v1/billing

# =========================
# PostgreSQL
# =========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/shop_db}
spring.datasource.username=${DB_USERNAME:shop_user}
spring.datasource.password=${DB_PASSWORD:shop_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create


spring.jpa.properties.hibernate.format_sql=false

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.trusted.packages=*


spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.vseonlineshop.shopservice.event.dtos.DomainEvent


kafka.topics.orders=orders
kafka.topics.audit-events=audit-events
kafka.topics.alerts=alertTopic
kafka.topics.payment=billing


# =========================
# Actuator / Prometheus
# =========================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always


# ==========================
# Normale Zahlung
# ==========================
resilience4j.retry.instances.payment.max-attempts=4
resilience4j.retry.instances.payment.wait-duration=1s
resilience4j.retry.instances.payment.enable-exponential-backoff=true
resilience4j.retry.instances.payment.exponential-backoff-multiplier=2
resilience4j.retry.instances.payment.retry-exceptions[0]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.payment.retry-exceptions[1]=org.springframework.web.client.HttpServerErrorException


# ==========================
# Saga Compensation Refund
# ==========================
resilience4j.retry.instances.refund.max-attempts=6
resilience4j.retry.instances.refund.wait-duration=2s
resilience4j.retry.instances.refund.enable-exponential-backoff=true
resilience4j.retry.instances.refund.exponential-backoff-multiplier=2
resilience4j.retry.instances.refund.retry-exceptions[0]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.refund.retry-exceptions[1]=org.springframework.web.client.HttpServerErrorException


# ==========================
# PayPal Capture
# ==========================
resilience4j.retry.instances.paypalCapture.max-attempts=5
resilience4j.retry.instances.paypalCapture.wait-duration=2s
resilience4j.retry.instances.paypalCapture.enable-exponential-backoff=true
resilience4j.retry.instances.paypalCapture.exponential-backoff-multiplier=2
resilience4j.retry.instances.paypalCapture.retry-exceptions[0]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.paypalCapture.retry-exceptions[1]=org.springframework.web.client.HttpServerErrorException


# =========================
# Warehouse Reserve
# =========================

resilience4j.retry.instances.warehouseReserve.max-attempts=3
resilience4j.retry.instances.warehouseReserve.wait-duration=500ms
resilience4j.retry.instances.warehouseReserve.enable-exponential-backoff=true
resilience4j.retry.instances.warehouseReserve.exponential-backoff-multiplier=2

resilience4j.retry.instances.warehouseReserve.retry-exceptions[0]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.warehouseReserve.retry-exceptions[1]=org.springframework.web.client.HttpServerErrorException



# =========================
# Warehouse Commit
# =========================

resilience4j.retry.instances.warehouseCommit.max-attempts=3
resilience4j.retry.instances.warehouseCommit.wait-duration=1s
resilience4j.retry.instances.warehouseCommit.enable-exponential-backoff=true
resilience4j.retry.instances.warehouseCommit.exponential-backoff-multiplier=2

resilience4j.retry.instances.warehouseCommit.retry-exceptions[0]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.warehouseCommit.retry-exceptions[1]=org.springframework.web.client.HttpServerErrorException



# =========================
# Warehouse Compensation
# =========================

resilience4j.retry.instances.warehouseCancel.max-attempts=6
resilience4j.retry.instances.warehouseCancel.wait-duration=2s
resilience4j.retry.instances.warehouseCancel.enable-exponential-backoff=true
resilience4j.retry.instances.warehouseCancel.exponential-backoff-multiplier=2

resilience4j.retry.instances.warehouseCancel.retry-exceptions[0]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.warehouseCancel.retry-exceptions[1]=org.springframework.web.client.HttpServerErrorException


# =========================
# Logging
# =========================

# Eigene Anwendung
logging.level.com.vseonlineshop=INFO

# Spring
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN

# Kafka
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka=WARN

# Hibernate / JPA
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Connection Pool
logging.level.com.zaxxer.hikari=WARN

# Embedded Tomcat
logging.level.org.apache.catalina=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.apache.coyote=WARN

# Actuator
logging.level.org.springframework.boot.actuate=WARN

# JSON-Serialisierung
logging.level.org.springframework.http.converter.json=WARN

# SQL nicht auf Konsole ausgeben
spring.jpa.show-sql=false