server.port=8087

spring.application.name=shop-service

# =========================
# Apis
# =========================

services.warehouse.url =http://localhost:5082
services.payment.url=http://127.0.0.1:8089

# =========================
# PostgreSQL
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5433/shop_db
spring.datasource.username=shop_user
spring.datasource.password=shop_password
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=false

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
logging.level.org.apache.kafka.clients=DEBUG
spring.kafka.producer.properties.spring.json.trusted.packages=*

# Vertraue allen Packages bei der Deserialisierung (wichtig für unterschiedliche Microservice-Pakete)
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Zwinge den Deserializer, deine spezifische Zielklasse zu nutzen, egal was im Header steht
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.vseonlineshop.shopservice.event.dtos.DomainEvent
logging.level.org.springframework.kafka.listener.KafkaMessageListenerContainer=DEBUG
logging.level.org.springframework.kafka.support.serializer=TRACE

kafka.topics.orders=orders
kafka.topics.alerts=alertTopic
kafka.topics.payment=payment


# =========================
# Actuator / Prometheus
# =========================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
