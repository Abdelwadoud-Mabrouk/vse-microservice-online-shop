server.port=8082

spring.application.name=shop-service

# =========================
# Apis
# =========================

api.warehouse =http://localhost:5082

# =========================
# PostgreSQL
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5433/shop_db
spring.datasource.username=shop_user
spring.datasource.password=shop_password
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=false

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
logging.level.org.apache.kafka.clients=DEBUG
spring.kafka.producer.properties.spring.json.trusted.packages=*

kafka.topics.orders=orders


# =========================
# Actuator / Prometheus
# =========================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
