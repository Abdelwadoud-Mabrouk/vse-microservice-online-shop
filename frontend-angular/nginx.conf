server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=30s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;


  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }

  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/shop/ {
    set $shop_upstream http://shop-service:8087;
    rewrite ^/api/shop/(.*)$ /$1 break;
    proxy_pass $shop_upstream;
  }

  location /api/warehouse/ {
    set $warehouse_upstream http://warehouse-service:8080;
    rewrite ^/api/warehouse/(.*)$ /$1 break;
    proxy_pass $warehouse_upstream;
  }

  location /api/audit/ {
    set $audit_upstream http://audit-service:8080;
    rewrite ^/api/audit/(.*)$ /$1 break;
    proxy_pass $audit_upstream;
  }

  location /api/invoices/ {
    set $invoice_upstream http://invoice-service:8080;
    rewrite ^/api/invoices/(.*)$ /$1 break;
    proxy_pass $invoice_upstream;
  }
}