server.port=8089
server.servlet.context-path=/api/v1/billing
spring.application.name=billing-service


# =========================
# PostgreSQL
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5435/billing_db
spring.datasource.username=billing_user
spring.datasource.password=billing_password
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=false

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
logging.level.org.apache.kafka.clients=DEBUG
spring.kafka.producer.properties.spring.json.trusted.packages=*

kafka.topics.payment=billing
kafka.topics.alerts.security=security-alerts
kafka.topics.alerts.system=system-alerts


payment.provider.active=STRIPE

# =========================
# Stripe
# =========================

stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}


# =========================
# Paypal
# =========================
paypal.client.id= ${PAYPAL_CLIENT_ID}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}
paypal.webhook.id=${PAYPAL_WEBHOOK_ID}

##  Zum Testen mit Fake-Geld und Test-Usern
sandbox_base = https://api-m.sandbox.paypal.com

success.page=${SUCCESS_PAGE_URL:http://localhost:4200/shop/checkout/success}

# =========================
# Actuator / Prometheus
# =========================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
