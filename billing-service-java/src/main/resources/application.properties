server.port=8089
server.servlet.context-path=/api/v1/billing
spring.application.name=billing-service


# =========================
# PostgreSQL
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5435/billing_db
spring.datasource.username=billing_user
spring.datasource.password=billing_password
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=false

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.spring.json.trusted.packages=*

kafka.topics.payment=billing
kafka.topics.alerts.security=security-alerts
kafka.topics.alerts.system=system-alerts



payment.routing.CREDIT_CARD=STRIPE
payment.routing.KLARNA=STRIPE
payment.routing.APPLE_PAY=STRIPE
payment.routing.GOOGLE_PAY=STRIPE
payment.routing.PAYPAL=PAYPAL
# =========================
# Stripe
# =========================

stripe.secret.key=${STRIPE_SECRET_KEY:test}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:test}


# =========================
# Paypal
# =========================
paypal.client.id= ${PAYPAL_CLIENT_ID:test}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:test}
paypal.webhook.id=${PAYPAL_WEBHOOK_ID:test}
paypal.timout=30

# sandbox oder production
paypal.environment=${PAYPAL_ENVIRONMENT:SANDBOX}

##  Zum Testen mit Fake-Geld und Test-Usern
sandbox_base = https://api-m.sandbox.paypal.com



success.page=${SUCCESS_PAGE_URL:http://localhost:4200/shop/checkout/success}

# =========================
# Actuator / Prometheus
# =========================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always


# =========================
# Logging
# =========================



logging.level.com.vseonlineshop=INFO


# =========================
# Spring
# =========================

logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN


# =========================
# Kafka komplett ruhig
# =========================

logging.level.org.apache.kafka=ERROR
logging.level.org.apache.kafka.clients=ERROR
logging.level.org.springframework.kafka=ERROR


# =========================
# Hibernate
# =========================

logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.warn=ERROR


# =========================
# Connection Pool
# =========================

logging.level.com.zaxxer.hikari=WARN


# =========================
# Tomcat
# =========================

logging.level.org.apache.catalina=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.apache.coyote=WARN


# =========================
# JPA
# =========================

spring.jpa.show-sql=false
spring.jpa.open-in-view=false


logging.file.path=./logs

