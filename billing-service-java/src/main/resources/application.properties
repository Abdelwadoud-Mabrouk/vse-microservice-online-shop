server.port=8089

spring.application.name=shop-service

# =========================
# Apis
# =========================

api.api =

# =========================
# PostgreSQL
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5435/payment_db
spring.datasource.username=payment_user
spring.datasource.password=payment_password
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=false

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
logging.level.org.apache.kafka.clients=DEBUG
spring.kafka.producer.properties.spring.json.trusted.packages=*

kafka.topics.payment=payment
kafka.topics.alerts=alertTopic


# =========================
# Stripe
# =========================
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_51TbeUUQA7jZQgiePERmuTksCYeuiatkyai5Ewv5cSpLnR71GQYb282Mmk0CPWWGpwI6r6bPMpmYqWer57xZif6pl00fVxqVwpj}

stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_a2aa272336f25813101cd24e363d49ba546e87250e8a52c4d1dedb3bee4b118c}

