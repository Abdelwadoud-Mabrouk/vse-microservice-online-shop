server.port=8089

spring.application.name=billing-service


# =========================
# PostgreSQL
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5435/billing_db
spring.datasource.username=billing_user
spring.datasource.password=billing_password
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=false

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
logging.level.org.apache.kafka.clients=DEBUG
spring.kafka.producer.properties.spring.json.trusted.packages=*

kafka.topics.payment=billing
kafka.topics.alerts=alertTopic
kafka.topics.audit-events=audit-events


# =========================
# Stripe
# =========================
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

paypal.client.id=${PAYPAL_CLIENT_ID}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}

success.page=${SUCCESS_PAGE_URL:http://127.0.0.1:5500/success.html}

# =========================
# Actuator / Prometheus
# =========================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
