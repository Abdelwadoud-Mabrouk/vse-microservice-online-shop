

# =========================
# PostgreSQL
# =========================
spring.datasource.url=${BILLING_DB_URL}
spring.datasource.username=${BILLING_DB_USERNAME}
spring.datasource.password=${BILLING_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=kafka:29092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.spring.json.trusted.packages=*

kafka.topics.payment=billing
kafka.topics.alerts.security=security-alerts
kafka.topics.alerts.system=system-alerts


payment.routing.CREDIT_CARD=STRIPE
payment.routing.KLARNA=STRIPE
payment.routing.APPLE_PAY=STRIPE
payment.routing.GOOGLE_PAY=STRIPE
payment.routing.PAYPAL=PAYPAL

# =========================
# Stripe
# =========================


stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}


# =========================
# Paypal
# =========================

paypal.client.id= ${PAYPAL_CLIENT_ID}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}
paypal.webhook.id=${PAYPAL_WEBHOOK_ID}
paypal.timout=30

# sandbox oder production
paypal.environment=${PAYPAL_ENVIRONMENT:SANDBOX}

##  Zum Testen mit Fake-Geld und Test-Usern
sandbox_base = https://api-m.sandbox.paypal.com


success.page=${SUCCESS_PAGE_URL}

# =========================
# Actuator / Prometheus
# =========================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
