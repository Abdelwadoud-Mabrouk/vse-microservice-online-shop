openapi: 3.0.3
info:
  title: Warehouse Service API
  version: 0.1.0
paths:
  /health:
    get:
      responses:
        "200":
          description: Service is healthy.
  /inventory:
    get:
      responses:
        "200":
          description: Current available stock.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      summary: Create a warehouse product for stock management.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveInventoryItemRequest"
      responses:
        "201":
          description: Product created.
        "409":
          description: Product id or SKU already exists.
  /inventory/{productId}:
    get:
      summary: Read one warehouse product.
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product found.
        "404":
          description: Product not found.
    put:
      summary: Update product master data and available quantity.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveInventoryItemRequest"
      responses:
        "200":
          description: Product updated.
        "404":
          description: Product not found.
        "409":
          description: SKU already used.
    delete:
      summary: Remove a product if it has no open reservation.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product removed.
        "409":
          description: Product cannot be removed.
  /inventory/{productId}/stock:
    patch:
      summary: Set available stock quantity.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStockQuantityRequest"
      responses:
        "200":
          description: Stock quantity changed.
        "404":
          description: Product not found.
  /reservations:
    post:
      summary: Check stock and reserve items.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: Reservation created.
        "200":
          description: Existing identical reservation returned (idempotent retry).
        "409":
          description: Insufficient stock or orderId reused with different items.
        "422":
          description: Invalid request.
  /reservations/{reservationId}:
    delete:
      summary: Cancel a reservation and return reserved stock.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reservation cancelled.
        "404":
          description: Reservation not found.
        "409":
          description: Reservation is committed and cannot be cancelled.
  /reservations/{reservationId}/commit:
    post:
      summary: Commit a reservation after successful payment.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reservation committed.
        "404":
          description: Reservation not found.
        "409":
          description: Reservation is cancelled and cannot be committed.
        "500":
          description: Controlled commit failure in Development or unexpected server error.
components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    SaveInventoryItemRequest:
      type: object
      required:
        - productId
        - sku
        - name
        - category
        - availableQuantity
      properties:
        productId:
          type: string
          format: uuid
          example: aaaaaaaa-0000-4000-8000-000000000001
        sku:
          type: string
          example: SKU-NEW-CHAIR
        name:
          type: string
          example: Neuer Stuhl
        category:
          type: string
          example: Stuehle
        availableQuantity:
          type: integer
          minimum: 0
          example: 10
    SetStockQuantityRequest:
      type: object
      required:
        - availableQuantity
      properties:
        availableQuantity:
          type: integer
          minimum: 0
          example: 25
    CreateReservationRequest:
      type: object
      required:
        - orderId
        - items
      properties:
        orderId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReservationItem"
    ReservationItem:
      type: object
      required:
        - productId
        - sku
        - quantity
      properties:
        productId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        sku:
          type: string
          example: SKU-CHAIR-OAK
        quantity:
          type: integer
          minimum: 1
    InventoryItem:
      type: object
      properties:
        productId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        sku:
          type: string
          example: SKU-CHAIR-OAK
        name:
          type: string
          example: Esszimmerstuhl Eiche
        category:
          type: string
          example: Stuehle
        availableQuantity:
          type: integer
          example: 24
