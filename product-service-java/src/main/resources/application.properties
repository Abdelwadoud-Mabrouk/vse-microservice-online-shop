spring.application.name=product-service-java


# =========================
# PostgreSQL Connection
# =========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/product_db}
spring.datasource.username=${DB_USERNAME:product_user}
spring.datasource.password=${DB_PASSWORD:product_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Sichert ab, dass Flyway-Migrationen vor der Hibernate-Validierung laufen
spring.jpa.properties.hibernate.default_schema=public

# =========================
# Flyway Migration
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG